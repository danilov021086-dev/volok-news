name: Проба доступности API площадок

# ВРЕМЕННЫЙ рабочий процесс. Отвечает на один вопрос: доходят ли
# российские облака до бегунка GitHub Actions (он за рубежом). От
# ответа зависит, где жить разбору новостей — в Actions или на нашем
# сервере. Запускается только руками.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Откуда мы ходим
        run: |
          echo "адрес бегунка:"; curl -s --max-time 15 https://api.ipify.org || true; echo
          curl -s --max-time 15 https://ipinfo.io/org || true; echo

      - name: Cloud.ru Foundation Models
        run: |
          echo "--- список моделей (без ключа, должен быть 200) ---"
          curl -s -o /tmp/cr.json -w 'код=%{http_code} время=%{time_total}c размер=%{size_download}\n' \
            --max-time 25 https://foundation-models.api.cloud.ru/v1/models || echo "НЕ ДОШЁЛ"
          head -c 200 /tmp/cr.json 2>/dev/null || true; echo
          echo "--- chat/completions без ключа (ждём 401, а не обрыв) ---"
          curl -s -o /dev/null -w 'код=%{http_code} время=%{time_total}c\n' --max-time 25 \
            -X POST https://foundation-models.api.cloud.ru/v1/chat/completions \
            -H 'content-type: application/json' -d '{"model":"x","messages":[]}' || echo "НЕ ДОШЁЛ"

      - name: Yandex AI Studio
        run: |
          echo "--- completion без ключа (ждём 400/401, а не обрыв) ---"
          curl -s -o /dev/null -w 'код=%{http_code} время=%{time_total}c\n' --max-time 25 \
            -X POST https://llm.api.cloud.yandex.net/foundationModels/v1/completion \
            -H 'content-type: application/json' -d '{}' || echo "НЕ ДОШЁЛ"
          echo "--- OpenAI-совместимый путь ---"
          curl -s -o /dev/null -w 'код=%{http_code} время=%{time_total}c\n' --max-time 25 \
            -X POST https://llm.api.cloud.yandex.net/v1/chat/completions \
            -H 'content-type: application/json' -d '{"model":"x","messages":[]}' || echo "НЕ ДОШЁЛ"

      - name: Наш сервер (для сравнения)
        run: |
          curl -s -o /dev/null -w 'наш сервер: код=%{http_code} время=%{time_total}c\n' \
            --max-time 20 http://2.135.146.133/apk/latest.json || echo "НЕ ДОШЁЛ"
